<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjana Lembaran Kerja Matematik (Dinamik)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f3f4f6;
        }

        /* KAWALAN CETAKAN KETAT */
        @media print {
            @page { size: A4 portrait; margin: 5mm; }
            body {
                background-color: white !important;
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
                margin: 0 !important; padding: 0 !important;
                zoom: 0.95; 
            }
            .no-print { display: none !important; }
            .a4-page {
                width: 100% !important;
                page-break-after: always; 
                page-break-inside: avoid;
                margin: 0 !important; padding: 0 !important;
                border: none !important; box-shadow: none !important;
                display: flex !important; flex-direction: column !important;
                min-height: 270mm !important;
            }
            .a4-page:last-child { page-break-after: auto; }
            .print-header {
                padding-bottom: 2px !important; margin-bottom: 5px !important; border-bottom-width: 2px !important;
            }
            .print-header h1 { margin-bottom: 2px !important; font-size: 1.1rem !important; }
            .question-grid {
                flex-grow: 1 !important; display: grid !important;
                grid-template-columns: repeat(2, 1fr) !important;
                grid-template-rows: repeat(3, 1fr) !important;
                gap: 5px !important; 
            }
            .q-box { padding: 6px !important; border-width: 1px !important; }
            .q-text { font-size: 0.8rem !important; line-height: 1.15 !important; margin-bottom: 2px !important; }
            .q-workspace { min-height: 50px !important; padding: 2px !important; margin-bottom: 2px !important; }
            .q-answer-container { padding: 0 !important; margin-top: 0 !important; background-color: transparent !important; border: none !important; }
        }
        
        .question-grid-screen {
            display: grid; grid-template-columns: repeat(1, minmax(0, 1fr)); gap: 1.5rem;
        }
        @media (min-width: 768px) {
            .question-grid-screen { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
    </style>
</head>
<body class="text-gray-800 p-4 md:p-8">

    <!-- PANEL KAWALAN -->
    <div class="no-print max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow-md mb-8 border-t-4 border-indigo-500">
        <h1 class="text-2xl font-bold text-indigo-700 mb-6 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg>
            Penjana Lembaran Kerja Matematik (Soalan Dinamik)
        </h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-indigo-50 p-5 rounded-xl border border-indigo-100">
                <h2 class="font-semibold mb-3 text-indigo-800">1. Pilih Operasi:</h2>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center gap-2 p-3 rounded-lg border bg-white cursor-pointer hover:bg-gray-50 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="checkbox" id="op-tambah" class="w-4 h-4" checked onchange="generateNewQuestions()">
                        <span class="font-medium">Tambah</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 rounded-lg border bg-white cursor-pointer hover:bg-gray-50 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="checkbox" id="op-tolak" class="w-4 h-4" checked onchange="generateNewQuestions()">
                        <span class="font-medium">Tolak</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 rounded-lg border bg-white cursor-pointer hover:bg-gray-50 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="checkbox" id="op-darab" class="w-4 h-4" checked onchange="generateNewQuestions()">
                        <span class="font-medium">Darab</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 rounded-lg border bg-white cursor-pointer hover:bg-gray-50 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="checkbox" id="op-bahagi" class="w-4 h-4" checked onchange="generateNewQuestions()">
                        <span class="font-medium">Bahagi</span>
                    </label>
                </div>
            </div>

            <div class="bg-indigo-50 p-5 rounded-xl border border-indigo-100 flex flex-col justify-center gap-4">
                <div class="flex items-center gap-3">
                    <h2 class="font-semibold text-indigo-800 whitespace-nowrap">2. Susunan Cetakan:</h2>
                    <select id="num-questions" class="border-gray-300 rounded-lg p-2 font-medium bg-white w-full" onchange="generateNewQuestions()">
                        <option value="6" selected>6 Soalan (1 Muka Surat)</option>
                        <option value="12">12 Soalan (2 Muka Surat)</option>
                        <option value="18">18 Soalan (3 Muka Surat)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 lg:grid-cols-3 gap-2 mt-2">
                    <button onclick="generateNewQuestions()" class="bg-emerald-500 hover:bg-emerald-600 text-white py-2 px-3 rounded-lg font-bold flex items-center justify-center gap-2 lg:col-span-1 col-span-2 shadow">
                        Jana Semula
                    </button>
                    <button id="btn-jawapan" onclick="toggleAnswers()" class="bg-sky-500 hover:bg-sky-600 text-white py-2 px-3 rounded-lg font-bold flex items-center justify-center gap-2 shadow">
                        <span id="text-jawapan">Jawapan</span>
                    </button>
                    <button onclick="window.print()" class="bg-gray-800 hover:bg-gray-900 text-white py-2 px-3 rounded-lg font-bold flex items-center justify-center gap-2 shadow">
                        Cetak Tepat
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="worksheet-wrapper" class="max-w-4xl mx-auto space-y-8"></div>

    <script>
        // KOSA KATA AI (LENGKAP DENGAN PENJODOH BILANGAN & KONTEKS LOGIK)
        const db = {
            budak: ["Ali", "Ammar", "Daniel", "Raju", "Muthu", "Chong", "Siti", "Aisyah", "Mei Ling", "Kavitha", "Suzi", "Fatimah", "Farhan"],
            dewasa: ["Cikgu Amin", "Puan Salmah", "Encik Lee", "Pak Abu", "Mak Minah", "Cikgu Wong", "Pekerja itu", "Tuan Haji"],
            alatTulis: [
                { nama: "pensel", unit: "batang" }, { nama: "buku cerita", unit: "buah" },
                { nama: "pemadam", unit: "keping" }, { nama: "pembaris", unit: "batang" },
                { nama: "krayon", unit: "batang" }, { nama: "buku latihan", unit: "buah" }
            ],
            makanan: [
                { nama: "karipap", unit: "biji" }, { nama: "nasi lemak", unit: "bungkus" },
                { nama: "kek", unit: "potong" }, { nama: "biskut", unit: "keping" },
                { nama: "gula-gula", unit: "biji" }, { nama: "coklat", unit: "keping" }
            ],
            buah: [
                { nama: "epal", unit: "biji" }, { nama: "rambutan", unit: "biji" },
                { nama: "durian", unit: "biji" }, { nama: "mangga", unit: "biji" },
                { nama: "tembikai", unit: "biji" }, { nama: "pisang", unit: "sikat" }
            ],
            haiwanTernak: [
                { nama: "ayam", unit: "ekor", rumah: "reban" }, { nama: "kambing", unit: "ekor", rumah: "kandang" },
                { nama: "itik", unit: "ekor", rumah: "kolam" }, { nama: "lembu", unit: "ekor", rumah: "padang" }
            ],
            kenderaan: [
                { nama: "kereta", unit: "buah" }, { nama: "basikal", unit: "buah" },
                { nama: "lori", unit: "buah" }, { nama: "motosikal", unit: "buah" }
            ]
        };

        let showAnswersMode = false;
        let currentQuestionsData = []; 

        const getRand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const getItem = (arr) => arr[Math.floor(Math.random() * arr.length)];
        const capitalize = (str) => str.charAt(0).toUpperCase() + str.slice(1);

        // ENJIN PEMBUAT AYAT DINAMIK (AI LOGIC GENERATOR)
        const createWordProblem = (operation) => {
            const budak1 = getItem(db.budak);
            let budak2 = getItem(db.budak);
            while(budak1 === budak2) budak2 = getItem(db.budak);
            const dewasa = getItem(db.dewasa);
            
            const type = getRand(1, 5); // Pilih senario logik
            let n1, n2, answer, text, equation;

            if (operation === 'tambah') {
                n1 = getRand(15, 60); n2 = getRand(10, 39); answer = n1 + n2; equation = `${n1} + ${n2} = ${answer}`;
                
                switch(type) {
                    case 1: // Senario: Menerima barang (Alat Tulis/Makanan)
                        let obj1 = getItem(db.alatTulis.concat(db.makanan));
                        text = `${budak1} mempunyai ${n1} ${obj1.unit} ${obj1.nama}. Kawan baiknya, ${budak2} telah memberikan ${n2} ${obj1.unit} lagi kepadanya. Hitung jumlah ${obj1.nama} yang ${budak1} ada sekarang.`;
                        break;
                    case 2: // Senario: Mengumpul/Memetik hasil
                        let buah = getItem(db.buah);
                        text = `${dewasa} telah memetik ${n1} ${buah.unit} ${buah.nama} di kebun semalam. Hari ini, dia berjaya memetik ${n2} ${buah.unit} lagi. Berapakah jumlah keseluruhan ${buah.nama} yang telah dipetik?`;
                        break;
                    case 3: // Senario: Menggabung kenderaan / haiwan
                        let haiwan = getItem(db.haiwanTernak);
                        text = `Terdapat ${n1} ${haiwan.unit} ${haiwan.nama} peliharaan ${dewasa}. Dia kemudiannya telah membeli ${n2} ${haiwan.unit} ${haiwan.nama} baharu untuk diternak. Berapa banyak ${haiwan.nama} peliharaannya kini?`;
                        break;
                    case 4: // Senario: Membeli barang
                        let obj4 = getItem(db.makanan);
                        text = `${dewasa} membeli ${n1} ${obj4.unit} ${obj4.nama} pada waktu pagi untuk majlis. Pada waktu petang, dia menambah ${n2} ${obj4.unit} lagi. Berapakah jumlah ${obj4.nama} kesemuanya?`;
                        break;
                    case 5: // Senario: Murid dalam kelas
                        text = `Tahun 2 Bijak terdiri daripada ${n1} orang murid. Tahun 2 Cemerlang pula mempunyai ${n2} orang murid. Kira jumlah murid bagi kedua-dua buah kelas tersebut.`;
                        break;
                }
            } 
            else if (operation === 'tolak') {
                n1 = getRand(40, 99); n2 = getRand(10, n1 - 10); answer = n1 - n2; equation = `${n1} - ${n2} = ${answer}`;

                switch(type) {
                    case 1: // Senario: Rosak / Pecah / Hilang
                        let obj1 = getItem(db.alatTulis);
                        text = `${budak1} ada ${n1} ${obj1.unit} ${obj1.nama} di dalam begnya. Namun, ${n2} ${obj1.unit} daripadanya telah hilang di sekolah. Berapakah baki ${obj1.nama} yang tinggal?`;
                        break;
                    case 2: // Senario: Menjual barang
                        let makanan = getItem(db.makanan);
                        text = `${dewasa} telah menyediakan ${n1} ${makanan.unit} ${makanan.nama} untuk dijual. Menjelang tengah hari, ${n2} ${makanan.unit} telah selamat dijual. Berapakah ${makanan.nama} yang belum dijual?`;
                        break;
                    case 3: // Senario: Memberi kepada orang lain
                        let buah = getItem(db.buah);
                        text = `Pada asalnya, ${budak2} mengumpul sebanyak ${n1} ${buah.unit} ${buah.nama}. Dia telah mengagihkan ${n2} ${buah.unit} kepada jiran-jirannya. Berapakah baki yang ada pada ${budak2}?`;
                        break;
                    case 4: // Senario: Penumpang bas / lori
                        text = `Sebuah bas persiaran sedang membawa ${n1} orang penumpang. Apabila tiba di stesen pertama, seramai ${n2} orang penumpang telah turun. Berapa orang yang masih berada di dalam bas?`;
                        break;
                    case 5: // Senario: Haiwan mati/dijual
                        let hwn = getItem(db.haiwanTernak);
                        text = `Pak Cik Badrul menternak ${n1} ${hwn.unit} ${hwn.nama} di dalam ${hwn.rumah}. Akibat wabak penyakit, ${n2} ${hwn.unit} daripadanya telah mati. Berapa ekor ${hwn.nama} yang masih hidup?`;
                        break;
                }
            }
            else if (operation === 'darab') {
                n1 = getRand(3, 9); n2 = getRand(3, 10); answer = n1 * n2; equation = `${n1} × ${n2} = ${answer}`;

                switch(type) {
                    case 1: // Senario: Kotak dan Isinya
                        let alat = getItem(db.alatTulis);
                        text = `Sebuah kedai buku mempunyai ${n1} buah kotak stok. Di dalam setiap kotak tersebut terdapat ${n2} ${alat.unit} ${alat.nama}. Hitung jumlah keseluruhan ${alat.nama} di kedai itu.`;
                        break;
                    case 2: // Senario: Hadiah kepada sekumpulan orang
                        let mkn = getItem(db.makanan);
                        text = `${dewasa} ingin memberikan hadiah. Setiap murid akan menerima ${n1} ${mkn.unit} ${mkn.nama}. Jika terdapat ${n2} orang murid, berapakah jumlah ${mkn.nama} yang diperlukan?`;
                        break;
                    case 3: // Senario: Susunan dalam dewan/kelas
                        text = `Di dalam sebuah dewan, pekerja menyusun kerusi kepada ${n1} baris panjang. Setiap baris disusun dengan tepat ${n2} buah kerusi. Kira jumlah kerusi di dalam dewan itu.`;
                        break;
                    case 4: // Senario: Kaki haiwan (Fakta logik! Kaki haiwan mesti betul)
                        let haiwanKaki = getItem([{nama: "kucing", kaki: 4}, {nama: "lembu", kaki: 4}, {nama: "ayam", kaki: 2}, {nama: "itik", kaki: 2}]);
                        n2 = haiwanKaki.kaki; // Tetapkan N2 mengikut fakta kaki
                        answer = n1 * n2; equation = `${n1} × ${n2} = ${answer}`;
                        text = `Seekor ${haiwanKaki.nama} normal mempunyai ${n2} batang kaki. Cuba kira berapakah jumlah kaki jika terdapat ${n1} ekor ${haiwanKaki.nama} di situ?`;
                        break;
                    case 5: // Senario: Wang simpanan harian
                        text = `${budak1} menabung wang saku sebanyak RM${n1} ke dalam tabungnya setiap hari. Berapakah jumlah wang simpanan ${budak1} selepas tempoh ${n2} hari?`;
                        break;
                }
            }
            else if (operation === 'bahagi') {
                n2 = getRand(2, 9); answer = getRand(3, 9); n1 = n2 * answer; equation = `${n1} ÷ ${n2} = ${answer}`;

                switch(type) {
                    case 1: // Senario: Agih sama rata kepada rakan
                        let buah2 = getItem(db.buah);
                        text = `${budak2} membawa pulang ${n1} ${buah2.unit} ${buah2.nama}. Dia membahagikan kesemua buah itu secara sama rata kepada ${n2} orang rakan baiknya. Berapakah jumlah buah yang didapati oleh setiap rakannya?`;
                        break;
                    case 2: // Senario: Membungkus semula
                        let biskut = getItem(db.makanan);
                        text = `${dewasa} membakar sebanyak ${n1} ${biskut.unit} ${biskut.nama}. Dia mahu memasukkan semuanya secara sama banyak ke dalam ${n2} bekas plastik. Berapa ${biskut.nama} perlu diletak dalam setiap bekas?`;
                        break;
                    case 3: // Senario: Cikgu mengagihkan barang
                        let brg = getItem(db.alatTulis);
                        text = `Sekolah telah menyumbangkan ${n1} ${brg.unit} ${brg.nama}. ${dewasa} mengagihkannya secara adil kepada ${n2} kelas yang berbeza. Berapa banyak ${brg.nama} yang akan diterima oleh setiap kelas?`;
                        break;
                    case 4: // Senario: Menyusun buku di rak
                        text = `Di perpustakaan, terdapat ${n1} buah buku cerita baharu. Pengawas pusat sumber perlu menyusunnya sama rata pada ${n2} tingkat rak buku. Berapa buah buku yang akan berada pada setiap tingkat?`;
                        break;
                    case 5: // Senario: Haiwan ke dalam kandang
                        let hwn = getItem(db.haiwanTernak);
                        text = `Pihak ladang mempunyai ${n1} ekor ${hwn.nama}. Mereka memisahkan ternakan itu secara purata ke dalam ${n2} buah ${hwn.rumah}. Hitung bilangan ${hwn.nama} di dalam sebuah ${hwn.rumah}.`;
                        break;
                }
            }
            return { text, equation, answer };
        };

        function generateNewQuestions() {
            const ops = [];
            if(document.getElementById('op-tambah').checked) ops.push('tambah');
            if(document.getElementById('op-tolak').checked) ops.push('tolak');
            if(document.getElementById('op-darab').checked) ops.push('darab');
            if(document.getElementById('op-bahagi').checked) ops.push('bahagi');

            if (ops.length === 0) {
                alert("Sila pilih sekurang-kurangnya SATU operasi.");
                document.getElementById('op-tambah').checked = true;
                ops.push('tambah');
            }

            const totalQuestions = parseInt(document.getElementById('num-questions').value);
            currentQuestionsData = [];

            for (let i = 0; i < totalQuestions; i++) {
                const op = getItem(ops);
                currentQuestionsData.push(createWordProblem(op));
            }
            renderWorksheet();
        }

        function renderWorksheet() {
            const qsPerPage = 6; 
            const totalPages = Math.ceil(currentQuestionsData.length / qsPerPage);
            const wrapper = document.getElementById('worksheet-wrapper');
            wrapper.innerHTML = ''; 
            let questionCounter = 1;

            for (let p = 0; p < totalPages; p++) {
                let pageHTML = `
                <div class="a4-page bg-white p-4 sm:p-8 shadow-xl rounded-2xl print:shadow-none print:rounded-none">
                    <div class="print-header flex-none border-b-2 border-gray-800 pb-2 mb-4">
                        <h1 class="text-xl font-extrabold text-center mb-2 uppercase tracking-wider text-gray-900">Lembaran Kerja Matematik</h1>
                        <div class="flex flex-col sm:flex-row justify-between gap-1 text-[0.8rem] font-bold text-gray-700">
                            <div class="flex items-end gap-1 w-full sm:w-1/2">
                                <span>NAMA:</span><div class="border-b border-gray-500 flex-grow border-dashed"></div>
                            </div>
                            <div class="flex flex-row justify-between w-full sm:w-1/2 gap-1">
                                <div class="flex items-end gap-1 w-1/2"><span>KELAS:</span><div class="border-b border-gray-500 flex-grow border-dashed"></div></div>
                                <div class="flex items-end gap-1 w-1/2"><span>TARIKH:</span><div class="border-b border-gray-500 flex-grow border-dashed"></div></div>
                            </div>
                        </div>
                    </div>
                    <div class="question-grid question-grid-screen">
                `;

                for (let i = 0; i < qsPerPage; i++) {
                    if (questionCounter > currentQuestionsData.length) break;
                    const q = currentQuestionsData[questionCounter - 1];

                    pageHTML += `
                        <div class="q-box h-full flex flex-col border border-gray-400 p-3 rounded-xl">
                            <div class="flex gap-2 mb-1 items-start">
                                <span class="bg-gray-800 text-white font-bold text-[0.8rem] h-5 w-5 flex items-center justify-center rounded-full flex-shrink-0 mt-0.5">${questionCounter}</span>
                                <p class="q-text text-[0.88rem] leading-snug font-semibold text-gray-800 text-justify pr-1">${q.text}</p>
                            </div>
                            <div class="q-workspace flex-grow border border-dashed rounded-lg p-2 mb-1 flex items-center justify-center bg-gray-50/50 ${showAnswersMode ? 'border-emerald-400 bg-emerald-50' : 'border-gray-300'}">
                                ${showAnswersMode ? `<div class="text-lg font-bold text-emerald-600">${q.equation}</div>` : ``}
                            </div>
                            <div class="q-answer-container flex items-center gap-2 text-sm mt-auto px-1">
                                <span class="font-bold text-gray-700">Jawapan:</span>
                                ${showAnswersMode ? `<span class="font-black text-rose-600">${q.answer}</span>` : `<div class="border-b border-gray-800 flex-grow border-solid"></div>`}
                            </div>
                        </div>
                    `;
                    questionCounter++;
                }
                pageHTML += `</div></div>`; 
                wrapper.innerHTML += pageHTML;
            }
        }

        function toggleAnswers() {
            showAnswersMode = !showAnswersMode;
            const btn = document.getElementById('btn-jawapan');
            const text = document.getElementById('text-jawapan');

            if (showAnswersMode) {
                text.innerText = "Tutup Jawapan";
                btn.classList.replace('bg-sky-500', 'bg-rose-500');
            } else {
                text.innerText = "Paparan Jawapan";
                btn.classList.replace('bg-rose-500', 'bg-sky-500');
            }
            renderWorksheet();
        }

        window.onload = generateNewQuestions;
    </script>
</body>
</html>
