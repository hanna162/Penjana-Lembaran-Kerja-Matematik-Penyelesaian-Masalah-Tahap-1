<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjana Lembaran Kerja Penyelesaian Masalah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Gaya khusus untuk percetakan */
        @media print {
            @page {
                size: A4 portrait;
                margin: 1.2cm; /* Margin lebih kecil sedikit untuk muat lebih soalan */
            }
            body {
                background-color: white;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            .worksheet-container {
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 !important;
                max-width: 100% !important;
                border: none !important;
            }
            .question-box {
                border-color: #9ca3af !important; /* Tailwind gray-400 */
                page-break-inside: avoid;
            }
            /* Grid untuk cetakan */
            #questions-grid {
                display: grid !important;
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                gap: 1.5rem !important; /* Kurangkan gap sikit semasa print */
            }
            /* Pemisah halaman setiap 8 soalan */
            .page-break-after {
                page-break-after: always;
                grid-column: span 2; /* Supaya break ambil seluruh baris */
                height: 0;
            }
        }
        
        .print-only {
            display: none;
        }
        
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Nunito', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 p-4 md:p-8">

    <!-- PANEL KAWALAN (Tidak akan dicetak) -->
    <div class="no-print max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow-md mb-8 border-t-4 border-indigo-500">
        <h1 class="text-2xl font-bold text-indigo-700 mb-6 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            Penjana Lembaran Kerja (Grid Padat - Jimat Kertas)
        </h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Tetapan Operasi -->
            <div class="bg-indigo-50 p-5 rounded-xl border border-indigo-100">
                <h2 class="font-semibold mb-3 text-indigo-800">1. Pilih Operasi:</h2>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center gap-2 p-3 rounded-lg border bg-white cursor-pointer hover:bg-gray-50 transition-colors has-[:checked]:bg-indigo-600 has-[:checked]:text-white has-[:checked]:border-indigo-700">
                        <input type="checkbox" id="op-tambah" class="w-4 h-4 accent-white" checked onchange="generateWorksheet()">
                        <span class="font-medium">Tambah</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 rounded-lg border bg-white cursor-pointer hover:bg-gray-50 transition-colors has-[:checked]:bg-indigo-600 has-[:checked]:text-white has-[:checked]:border-indigo-700">
                        <input type="checkbox" id="op-tolak" class="w-4 h-4 accent-white" checked onchange="generateWorksheet()">
                        <span class="font-medium">Tolak</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 rounded-lg border bg-white cursor-pointer hover:bg-gray-50 transition-colors has-[:checked]:bg-indigo-600 has-[:checked]:text-white has-[:checked]:border-indigo-700">
                        <input type="checkbox" id="op-darab" class="w-4 h-4 accent-white" checked onchange="generateWorksheet()">
                        <span class="font-medium">Darab</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 rounded-lg border bg-white cursor-pointer hover:bg-gray-50 transition-colors has-[:checked]:bg-indigo-600 has-[:checked]:text-white has-[:checked]:border-indigo-700">
                        <input type="checkbox" id="op-bahagi" class="w-4 h-4 accent-white" checked onchange="generateWorksheet()">
                        <span class="font-medium">Bahagi</span>
                    </label>
                </div>
            </div>

            <!-- Tetapan & Tindakan -->
            <div class="bg-indigo-50 p-5 rounded-xl border border-indigo-100 flex flex-col justify-center gap-4">
                <div class="flex items-center gap-3">
                    <h2 class="font-semibold text-indigo-800 whitespace-nowrap">2. Tetapan Cetakan:</h2>
                    <select id="num-questions" class="border-gray-300 rounded-lg p-2 font-medium bg-white w-full shadow-sm focus:ring-indigo-500 focus:border-indigo-500" onchange="generateWorksheet()">
                        <option value="4">4 Soalan (Setengah Muka Surat)</option>
                        <option value="8" selected>8 Soalan (1 Muka Surat Penuh)</option>
                        <option value="16">16 Soalan (2 Muka Surat)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 lg:grid-cols-3 gap-2 mt-2">
                    <button onclick="generateWorksheet()" class="bg-emerald-500 hover:bg-emerald-600 text-white py-2.5 px-4 rounded-lg font-bold flex items-center justify-center gap-2 transition-all shadow-sm active:scale-95 lg:col-span-1 col-span-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
                        Jana
                    </button>
                    
                    <button id="btn-jawapan" onclick="toggleAnswers()" class="bg-sky-500 hover:bg-sky-600 text-white py-2.5 px-4 rounded-lg font-bold flex items-center justify-center gap-2 transition-all shadow-sm active:scale-95">
                        <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <span id="text-jawapan">Jawapan</span>
                    </button>

                    <button onclick="window.print()" class="bg-gray-800 hover:bg-gray-900 text-white py-2.5 px-4 rounded-lg font-bold flex items-center justify-center gap-2 transition-all shadow-sm active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                        Cetak
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- LEMBARAN KERJA (Kawasan yang akan dicetak) -->
    <div class="worksheet-container max-w-4xl mx-auto bg-white p-6 sm:p-10 shadow-xl rounded-2xl border border-gray-100">
        
        <!-- Pengepala Lembaran -->
        <div class="border-b-4 border-gray-800 pb-4 mb-6">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-center mb-6 uppercase tracking-widest text-gray-900">Lembaran Kerja Matematik</h1>
            <div class="flex flex-col sm:flex-row justify-between gap-4 text-base">
                <div class="flex items-end gap-2 w-full sm:w-1/2">
                    <span class="font-bold whitespace-nowrap">NAMA :</span>
                    <div class="border-b-2 border-gray-500 flex-grow border-dashed"></div>
                </div>
                <div class="flex flex-row justify-between w-full sm:w-1/2 gap-4">
                    <div class="flex items-end gap-2 w-1/2">
                        <span class="font-bold whitespace-nowrap">KELAS :</span>
                        <div class="border-b-2 border-gray-500 flex-grow border-dashed"></div>
                    </div>
                    <div class="flex items-end gap-2 w-1/2">
                        <span class="font-bold whitespace-nowrap">TARIKH :</span>
                        <div class="border-b-2 border-gray-500 flex-grow border-dashed"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Grid Soalan: 2 Lajur -->
        <div id="questions-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Soalan akan dijana di sini oleh JavaScript -->
        </div>

    </div>

    <!-- LOGIK JAVASCRIPT -->
    <script>
        const names = ["Ahmad", "Siti", "Ali", "Aisyah", "Muthu", "Mei Ling", "Raju", "Farid", "Nurul", "Daniel", "Chong", "Kavitha"];
        const items = ["biji epal", "batang pensel", "biji guli", "buah buku cerita", "keping biskut", "biji gula-gula", "biji oren", "keping pemadam", "buah mainan"];
        const containers = ["bakul", "kotak", "balang", "beg", "paket", "bekas"];

        let showAnswersMode = false;

        const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const getRandomItem = (arr) => arr[Math.floor(Math.random() * arr.length)];

        const generateWordProblem = (operation) => {
            const name = getRandomItem(names);
            const item = getRandomItem(items);
            const container = getRandomItem(containers);
            
            let n1, n2, answer, text, equation;

            switch (operation) {
                case 'tambah':
                    n1 = getRandomInt(15, 80);
                    n2 = getRandomInt(10, 40);
                    answer = n1 + n2;
                    equation = `${n1} + ${n2} = ${answer}`;
                    text = getRandomItem([
                        `${name} ada ${n1} ${item}. Ibunya membelikan ${n2} ${item} lagi kepadanya. Berapakah jumlah ${item} ${name} sekarang?`,
                        `Terdapat ${n1} ${item} di dalam ${container} merah dan ${n2} ${item} di dalam ${container} biru. Kira jumlah kesemuanya.`,
                        `${name} mengumpul ${n1} ${item} pada hari Isnin dan ${n2} ${item} pada hari Selasa. Berapa banyak ${item} yang dikumpul?`
                    ]);
                    break;
                case 'tolak':
                    n1 = getRandomInt(40, 95);
                    n2 = getRandomInt(10, n1 - 10);
                    answer = n1 - n2;
                    equation = `${n1} - ${n2} = ${answer}`;
                    text = getRandomItem([
                        `${name} mempunyai ${n1} ${item}. Dia memberikan ${n2} ${item} kepada kawannya. Berapakah baki ${item} yang tinggal?`,
                        `Sebuah kedai ada ${n1} ${item}. Penjual itu telah menjual ${n2} ${item}. Berapa banyak ${item} yang belum dijual?`,
                        `${name} membawa ${n1} ${item} ke sekolah. Dia kehilangan ${n2} ${item}. Berapa ${item} yang ${name} ada sekarang?`
                    ]);
                    break;
                case 'darab':
                    n1 = getRandomInt(2, 9);
                    n2 = getRandomInt(2, 9);
                    answer = n1 * n2;
                    equation = `${n1} × ${n2} = ${answer}`;
                    text = getRandomItem([
                        `${name} membeli ${n1} ${container}. Setiap ${container} berisi ${n2} ${item}. Berapakah jumlah ${item} semuanya?`,
                        `Dalam sebuah bilik ada ${n1} buah meja. Atas setiap meja diletakkan ${n2} ${item}. Kira jumlah kesemua ${item} itu.`,
                        `Seorang guru menyusun kerusi dalam ${n1} baris. Setiap baris ada ${n2} buah kerusi. Berapa jumlah kerusi semuanya?`
                    ]);
                    break;
                case 'bahagi':
                    n2 = getRandomInt(2, 9);
                    answer = getRandomInt(3, 9);
                    n1 = n2 * answer;
                    equation = `${n1} ÷ ${n2} = ${answer}`;
                    text = getRandomItem([
                        `${name} mempunyai ${n1} ${item}. Dia mengagihkan sama rata kepada ${n2} orang kawan. Berapa setiap orang dapat?`,
                        `Sebanyak ${n1} ${item} dimasukkan sama banyak ke dalam ${n2} ${container}. Berapakah bilangan dalam setiap ${container}?`,
                        `Cikgu edarkan ${n1} ${item} kepada ${n2} kumpulan murid secara sama rata. Berapakah ${item} diterima setiap kumpulan?`
                    ]);
                    break;
            }

            return { text, equation, answer };
        };

        function generateWorksheet() {
            const ops = [];
            if(document.getElementById('op-tambah').checked) ops.push('tambah');
            if(document.getElementById('op-tolak').checked) ops.push('tolak');
            if(document.getElementById('op-darab').checked) ops.push('darab');
            if(document.getElementById('op-bahagi').checked) ops.push('bahagi');

            if (ops.length === 0) {
                alert("Sila pilih sekurang-kurangnya SATU operasi matematik.");
                document.getElementById('op-tambah').checked = true;
                ops.push('tambah');
            }

            const numQuestions = parseInt(document.getElementById('num-questions').value);
            const grid = document.getElementById('questions-grid');
            grid.innerHTML = ''; 

            for (let i = 1; i <= numQuestions; i++) {
                const op = getRandomItem(ops);
                const q = generateWordProblem(op);

                // Kotak soalan yang lebih compact
                let questionHTML = `
                    <div class="question-box w-full flex flex-col border border-gray-300 p-4 rounded-xl bg-white">
                        <div class="flex gap-3 mb-3">
                            <span class="bg-gray-800 text-white font-bold text-lg h-7 w-7 flex items-center justify-center rounded-full flex-shrink-0">
                                ${i}
                            </span>
                            <p class="text-[0.95rem] leading-snug font-medium text-gray-800">${q.text}</p>
                        </div>
                        
                        <div class="flex-grow flex flex-col justify-end">
                            <!-- Ruang Jalan Kerja dipadatkan sedikit (min-h-[100px]) supaya muat 8 soalan -->
                            <div class="answer-box border border-dashed rounded-lg p-2 min-h-[110px] mb-3 flex items-center justify-center bg-gray-50 ${showAnswersMode ? 'border-emerald-400 bg-emerald-50' : 'border-gray-300'}">
                                ${showAnswersMode 
                                    ? `<div class="text-xl font-bold text-emerald-600">${q.equation}</div>`
                                    : ``
                                }
                            </div>
                            
                            <div class="flex items-center gap-2 text-base">
                                <span class="font-bold text-gray-700">Jawapan:</span>
                                ${showAnswersMode 
                                    ? `<span class="font-bold text-rose-600 underline ml-1">${q.answer}</span>`
                                    : `<div class="border-b border-gray-800 w-20 ml-1"></div>`
                                }
                            </div>
                        </div>
                    </div>
                `;
                
                grid.innerHTML += questionHTML;

                // Tambah page-break selepas setiap 8 soalan (untuk grid 2x4)
                if (i % 8 === 0 && i !== numQuestions) {
                    grid.innerHTML += `<div class="page-break-after"></div>`;
                }
            }
            
            // Tambah pengaki
            const footerHTML = `
            <div class="print-only mt-4 text-center text-xs text-gray-500 font-medium col-span-2 w-full" style="grid-column: span 2;">
                Lembaran Kerja Matematik - Penyelesaian Masalah | Dijana secara automatik
            </div>`;
            
            // Letak footer di hujung (atau sebelum page break terakhir)
             grid.innerHTML += footerHTML;
        }

        function toggleAnswers() {
            showAnswersMode = !showAnswersMode;
            const btn = document.getElementById('btn-jawapan');
            const text = document.getElementById('text-jawapan');
            const iconEye = document.getElementById('icon-eye');

            if (showAnswersMode) {
                text.innerText = "Tutup Jawapan";
                btn.classList.replace('bg-sky-500', 'bg-rose-500');
                btn.classList.replace('hover:bg-sky-600', 'hover:bg-rose-600');
            } else {
                text.innerText = "Jawapan";
                btn.classList.replace('bg-rose-500', 'bg-sky-500');
                btn.classList.replace('hover:bg-rose-600', 'hover:bg-sky-600');
            }
            generateWorksheet();
        }

        window.onload = generateWorksheet;
    </script>
</body>
</html>
