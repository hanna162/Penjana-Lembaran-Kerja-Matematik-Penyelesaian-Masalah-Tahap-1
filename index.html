<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjana Lembaran Kerja (Ultimate Compact)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f3f4f6;
        }

        /* --- KAWALAN CETAKAN ULTIMATE --- */
        @media print {
            @page {
                size: A4 portrait;
                margin: 5mm; /* Margin paling minimum (5mm) */
            }
            body {
                background-color: white !important;
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
                margin: 0 !important;
                padding: 0 !important;
                zoom: 0.95; /* KUNCI UTAMA: Kecilkan dokumen 5% supaya gerenti muat! */
            }
            .no-print {
                display: none !important;
            }
            
            .a4-page {
                width: 100% !important;
                /* Biarkan browser tentukan height secara semula jadi, tetapi break dengan betul */
                page-break-after: always; 
                page-break-inside: avoid;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                box-shadow: none !important;
                display: flex !important;
                flex-direction: column !important;
                min-height: 270mm !important; /* Paksa minimum height */
            }
            .a4-page:last-child {
                page-break-after: auto;
            }

            .print-header {
                padding-bottom: 2px !important;
                margin-bottom: 5px !important;
                border-bottom-width: 2px !important;
            }
            .print-header h1 {
                margin-bottom: 2px !important;
                font-size: 1.1rem !important; /* Tajuk lebih kecil */
            }

            .question-grid {
                flex-grow: 1 !important;
                display: grid !important;
                grid-template-columns: repeat(2, 1fr) !important;
                grid-template-rows: repeat(3, 1fr) !important;
                gap: 5px !important; /* Gap sangat, sangat kecil */
            }

            .q-box {
                padding: 6px !important; /* Padding minimum */
                border-width: 1px !important;
            }
            .q-text {
                font-size: 0.8rem !important; /* Teks dikecilkan */
                line-height: 1.15 !important;
                margin-bottom: 2px !important;
            }
            .q-workspace {
                min-height: 50px !important; 
                padding: 2px !important;
                margin-bottom: 2px !important;
            }
            /* Jawapan dibuang background supaya jimat 20px ketinggian */
            .q-answer-container {
                padding: 0 !important;
                margin-top: 0 !important;
                background-color: transparent !important;
                border: none !important;
            }
        }
        
        /* Paparan skrin (bukan print) */
        .question-grid-screen {
            display: grid;
            grid-template-columns: repeat(1, minmax(0, 1fr));
            gap: 1.5rem;
        }
        @media (min-width: 768px) {
            .question-grid-screen {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>
<body class="text-gray-800 p-4 md:p-8">

    <!-- PANEL KAWALAN -->
    <div class="no-print max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow-md mb-8 border-t-4 border-indigo-500">
        <h1 class="text-2xl font-bold text-indigo-700 mb-6 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg>
            Penjana Lembaran Kerja (Versi Ultimate Compact)
        </h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-indigo-50 p-5 rounded-xl border border-indigo-100">
                <h2 class="font-semibold mb-3 text-indigo-800">1. Pilih Operasi:</h2>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center gap-2 p-3 rounded-lg border bg-white cursor-pointer hover:bg-gray-50 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="checkbox" id="op-tambah" class="w-4 h-4" checked onchange="generateWorksheet()">
                        <span class="font-medium">Tambah</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 rounded-lg border bg-white cursor-pointer hover:bg-gray-50 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="checkbox" id="op-tolak" class="w-4 h-4" checked onchange="generateWorksheet()">
                        <span class="font-medium">Tolak</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 rounded-lg border bg-white cursor-pointer hover:bg-gray-50 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="checkbox" id="op-darab" class="w-4 h-4" checked onchange="generateWorksheet()">
                        <span class="font-medium">Darab</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 rounded-lg border bg-white cursor-pointer hover:bg-gray-50 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="checkbox" id="op-bahagi" class="w-4 h-4" checked onchange="generateWorksheet()">
                        <span class="font-medium">Bahagi</span>
                    </label>
                </div>
            </div>

            <div class="bg-indigo-50 p-5 rounded-xl border border-indigo-100 flex flex-col justify-center gap-4">
                <div class="flex items-center gap-3">
                    <h2 class="font-semibold text-indigo-800 whitespace-nowrap">2. Susunan Cetakan:</h2>
                    <select id="num-questions" class="border-gray-300 rounded-lg p-2 font-medium bg-white w-full" onchange="generateWorksheet()">
                        <option value="6" selected>6 Soalan (1 Muka Surat)</option>
                        <option value="12">12 Soalan (2 Muka Surat)</option>
                        <option value="18">18 Soalan (3 Muka Surat)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 lg:grid-cols-3 gap-2 mt-2">
                    <button onclick="generateWorksheet()" class="bg-emerald-500 hover:bg-emerald-600 text-white py-2 px-3 rounded-lg font-bold flex items-center justify-center gap-2 lg:col-span-1 col-span-2 shadow">
                        Jana Semula
                    </button>
                    <button id="btn-jawapan" onclick="toggleAnswers()" class="bg-sky-500 hover:bg-sky-600 text-white py-2 px-3 rounded-lg font-bold flex items-center justify-center gap-2 shadow">
                        <span id="text-jawapan">Jawapan</span>
                    </button>
                    <button onclick="window.print()" class="bg-gray-800 hover:bg-gray-900 text-white py-2 px-3 rounded-lg font-bold flex items-center justify-center gap-2 shadow">
                        Cetak Tepat
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- BEKAS LEMBARAN -->
    <div id="worksheet-wrapper" class="max-w-4xl mx-auto space-y-8">
        <!-- Dijana oleh JS -->
    </div>

    <script>
        // Data soalan yang sama macam sebelum ini
        const names = ["Ahmad", "Siti", "Ali", "Aisyah", "Muthu", "Mei", "Raju", "Farid", "Nurul", "Daniel", "Adam", "Mia"];
        const items = ["biji epal", "batang pensel", "biji guli", "buku", "keping biskut", "gula-gula", "biji oren", "pemadam", "mainan"];
        const containers = ["bakul", "kotak", "balang", "beg", "plastik"];

        let showAnswersMode = false;

        const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const getRandomItem = (arr) => arr[Math.floor(Math.random() * arr.length)];

        // Teks paling pendek (supaya tidak jadi 3 baris kalau boleh)
        const generateWordProblem = (operation) => {
            const name = getRandomItem(names);
            const item = getRandomItem(items);
            const container = getRandomItem(containers);
            
            let n1, n2, answer, text, equation;

            switch (operation) {
                case 'tambah':
                    n1 = getRandomInt(15, 80); n2 = getRandomInt(10, 40); answer = n1 + n2;
                    equation = `${n1} + ${n2} = ${answer}`;
                    text = getRandomItem([
                        `${name} ada ${n1} ${item}. Ibu beri ${n2} ${item} lagi. Berapa jumlah sekarang?`,
                        `Ada ${n1} ${item} dalam beg A dan ${n2} ${item} dalam beg B. Kira jumlahnya.`,
                        `${name} beli ${n1} ${item}. Kemudian beli ${n2} ${item} lagi. Berapa banyak dikumpul?`
                    ]);
                    break;
                case 'tolak':
                    n1 = getRandomInt(40, 95); n2 = getRandomInt(10, n1 - 10); answer = n1 - n2;
                    equation = `${n1} - ${n2} = ${answer}`;
                    text = getRandomItem([
                        `${name} ada ${n1} ${item}. Diberi ${n2} ${item} kepada kawan. Berapa baki tinggal?`,
                        `Kedai ada ${n1} ${item}. Dijual ${n2} ${item}. Berapa banyak yang belum dijual?`,
                        `Dari ${n1} ${item}, sebanyak ${n2} rosak. Berapa yang elok?`
                    ]);
                    break;
                case 'darab':
                    n1 = getRandomInt(2, 9); n2 = getRandomInt(2, 9); answer = n1 * n2;
                    equation = `${n1} × ${n2} = ${answer}`;
                    text = getRandomItem([
                        `${name} beli ${n1} kotak. Setiap kotak ada ${n2} ${item}. Kira jumlahnya?`,
                        `Ada ${n1} meja. Atas setiap meja ada ${n2} ${item}. Kira jumlahnya.`,
                        `Guru susun ${n1} baris. Setiap baris ada ${n2} kerusi. Berapa jumlah kerusi?`
                    ]);
                    break;
                case 'bahagi':
                    n2 = getRandomInt(2, 9); answer = getRandomInt(3, 9); n1 = n2 * answer;
                    equation = `${n1} ÷ ${n2} = ${answer}`;
                    text = getRandomItem([
                        `${name} agihkan ${n1} ${item} sama rata kepada ${n2} kawan. Berapa seorang dapat?`,
                        `${n1} ${item} diisi sama rata dalam ${n2} ${container}. Berapa isi setiap ${container}?`,
                        `Cikgu edar ${n1} ${item} kepada ${n2} kumpulan. Berapa diterima setiap kumpulan?`
                    ]);
                    break;
            }
            return { text, equation, answer };
        };

        function generateWorksheet() {
            const ops = [];
            if(document.getElementById('op-tambah').checked) ops.push('tambah');
            if(document.getElementById('op-tolak').checked) ops.push('tolak');
            if(document.getElementById('op-darab').checked) ops.push('darab');
            if(document.getElementById('op-bahagi').checked) ops.push('bahagi');

            if (ops.length === 0) {
                alert("Sila pilih sekurang-kurangnya SATU operasi.");
                document.getElementById('op-tambah').checked = true;
                ops.push('tambah');
            }

            const totalQuestions = parseInt(document.getElementById('num-questions').value);
            const qsPerPage = 6; 
            const totalPages = Math.ceil(totalQuestions / qsPerPage);
            
            const wrapper = document.getElementById('worksheet-wrapper');
            wrapper.innerHTML = ''; 

            let questionCounter = 1;

            for (let p = 0; p < totalPages; p++) {
                
                let pageHTML = `
                <div class="a4-page bg-white p-4 sm:p-8 shadow-xl rounded-2xl print:shadow-none print:rounded-none">
                    <!-- HEADER -->
                    <div class="print-header flex-none border-b-2 border-gray-800 pb-2 mb-4">
                        <h1 class="text-xl font-extrabold text-center mb-2 uppercase tracking-wider text-gray-900">Lembaran Kerja Matematik</h1>
                        <div class="flex flex-col sm:flex-row justify-between gap-1 text-[0.8rem] font-bold text-gray-700">
                            <div class="flex items-end gap-1 w-full sm:w-1/2">
                                <span>NAMA:</span><div class="border-b border-gray-500 flex-grow border-dashed"></div>
                            </div>
                            <div class="flex flex-row justify-between w-full sm:w-1/2 gap-1">
                                <div class="flex items-end gap-1 w-1/2">
                                    <span>KELAS:</span><div class="border-b border-gray-500 flex-grow border-dashed"></div>
                                </div>
                                <div class="flex items-end gap-1 w-1/2">
                                    <span>TARIKH:</span><div class="border-b border-gray-500 flex-grow border-dashed"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- GRID SOALAN -->
                    <div class="question-grid question-grid-screen">
                `;

                for (let i = 0; i < qsPerPage; i++) {
                    if (questionCounter > totalQuestions) break;

                    const op = getRandomItem(ops);
                    const q = generateWordProblem(op);

                    // Susunan kotak soalan tanpa border kelabu pada ruangan jawapan (supaya jimat saiz height!)
                    pageHTML += `
                        <div class="q-box h-full flex flex-col border border-gray-400 p-3 rounded-xl">
                            <!-- Teks Soalan -->
                            <div class="flex gap-2 mb-1 items-start">
                                <span class="bg-gray-800 text-white font-bold text-[0.8rem] h-5 w-5 flex items-center justify-center rounded-full flex-shrink-0 mt-0.5">
                                    ${questionCounter}
                                </span>
                                <p class="q-text text-[0.9rem] leading-snug font-semibold text-gray-800">${q.text}</p>
                            </div>
                            
                            <!-- Ruang Jalan Kerja -->
                            <div class="q-workspace flex-grow border border-dashed rounded-lg p-2 mb-1 flex items-center justify-center bg-gray-50/50 ${showAnswersMode ? 'border-emerald-400 bg-emerald-50' : 'border-gray-300'}">
                                ${showAnswersMode 
                                    ? `<div class="text-lg font-bold text-emerald-600">${q.equation}</div>`
                                    : ``
                                }
                            </div>
                            
                            <!-- Ruang Jawapan (Design diringkaskan) -->
                            <div class="q-answer-container flex items-center gap-2 text-sm mt-auto px-1">
                                <span class="font-bold text-gray-700">Jawapan:</span>
                                ${showAnswersMode 
                                    ? `<span class="font-black text-rose-600">${q.answer}</span>`
                                    : `<div class="border-b border-gray-800 flex-grow border-solid"></div>`
                                }
                            </div>
                        </div>
                    `;
                    questionCounter++;
                }

                pageHTML += `
                    </div>
                </div>`; 

                wrapper.innerHTML += pageHTML;
            }
        }

        function toggleAnswers() {
            showAnswersMode = !showAnswersMode;
            const btn = document.getElementById('btn-jawapan');
            const text = document.getElementById('text-jawapan');

            if (showAnswersMode) {
                text.innerText = "Tutup Jawapan";
                btn.classList.replace('bg-sky-500', 'bg-rose-500');
                btn.classList.replace('hover:bg-sky-600', 'hover:bg-rose-600');
            } else {
                text.innerText = "Paparan Jawapan";
                btn.classList.replace('bg-rose-500', 'bg-sky-500');
                btn.classList.replace('hover:bg-rose-600', 'hover:bg-sky-600');
            }
            generateWorksheet();
        }

        window.onload = generateWorksheet;
    </script>
</body>
</html>
