<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjana Lembaran Kerja Matematik (Penyelesaian Masalah)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f3f4f6;
        }

        /* --- KAWALAN CETAKAN ULTIMATE --- */
        @media print {
            @page {
                size: A4 portrait;
                margin: 5mm; 
            }
            body {
                background-color: white !important;
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
                margin: 0 !important;
                padding: 0 !important;
                zoom: 0.95; 
            }
            .no-print {
                display: none !important;
            }
            
            .a4-page {
                width: 100% !important;
                page-break-after: always; 
                page-break-inside: avoid;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                box-shadow: none !important;
                display: flex !important;
                flex-direction: column !important;
                min-height: 270mm !important;
            }
            .a4-page:last-child {
                page-break-after: auto;
            }

            .print-header {
                padding-bottom: 2px !important;
                margin-bottom: 5px !important;
                border-bottom-width: 2px !important;
            }
            .print-header h1 {
                margin-bottom: 2px !important;
                font-size: 1.1rem !important; 
            }

            .question-grid {
                flex-grow: 1 !important;
                display: grid !important;
                grid-template-columns: repeat(2, 1fr) !important;
                grid-template-rows: repeat(3, 1fr) !important;
                gap: 5px !important; 
            }

            .q-box {
                padding: 6px !important; 
                border-width: 1px !important;
            }
            .q-text {
                font-size: 0.8rem !important; 
                line-height: 1.15 !important;
                margin-bottom: 2px !important;
            }
            .q-workspace {
                min-height: 50px !important; 
                padding: 2px !important;
                margin-bottom: 2px !important;
            }
            .q-answer-container {
                padding: 0 !important;
                margin-top: 0 !important;
                background-color: transparent !important;
                border: none !important;
            }
        }
        
        .question-grid-screen {
            display: grid;
            grid-template-columns: repeat(1, minmax(0, 1fr));
            gap: 1.5rem;
        }
        @media (min-width: 768px) {
            .question-grid-screen {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>
<body class="text-gray-800 p-4 md:p-8">

    <!-- PANEL KAWALAN -->
    <div class="no-print max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow-md mb-8 border-t-4 border-indigo-500">
        <h1 class="text-2xl font-bold text-indigo-700 mb-6 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg>
            Penjana Lembaran Kerja Matematik (Penyelesaian Masalah)
        </h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-indigo-50 p-5 rounded-xl border border-indigo-100">
                <h2 class="font-semibold mb-3 text-indigo-800">1. Pilih Operasi:</h2>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center gap-2 p-3 rounded-lg border bg-white cursor-pointer hover:bg-gray-50 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="checkbox" id="op-tambah" class="w-4 h-4" checked onchange="generateNewQuestions()">
                        <span class="font-medium">Tambah</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 rounded-lg border bg-white cursor-pointer hover:bg-gray-50 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="checkbox" id="op-tolak" class="w-4 h-4" checked onchange="generateNewQuestions()">
                        <span class="font-medium">Tolak</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 rounded-lg border bg-white cursor-pointer hover:bg-gray-50 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="checkbox" id="op-darab" class="w-4 h-4" checked onchange="generateNewQuestions()">
                        <span class="font-medium">Darab</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 rounded-lg border bg-white cursor-pointer hover:bg-gray-50 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="checkbox" id="op-bahagi" class="w-4 h-4" checked onchange="generateNewQuestions()">
                        <span class="font-medium">Bahagi</span>
                    </label>
                </div>
            </div>

            <div class="bg-indigo-50 p-5 rounded-xl border border-indigo-100 flex flex-col justify-center gap-4">
                <div class="flex items-center gap-3">
                    <h2 class="font-semibold text-indigo-800 whitespace-nowrap">2. Susunan Cetakan:</h2>
                    <select id="num-questions" class="border-gray-300 rounded-lg p-2 font-medium bg-white w-full" onchange="generateNewQuestions()">
                        <option value="6" selected>6 Soalan (1 Muka Surat)</option>
                        <option value="12">12 Soalan (2 Muka Surat)</option>
                        <option value="18">18 Soalan (3 Muka Surat)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 lg:grid-cols-3 gap-2 mt-2">
                    <button onclick="generateNewQuestions()" class="bg-emerald-500 hover:bg-emerald-600 text-white py-2 px-3 rounded-lg font-bold flex items-center justify-center gap-2 lg:col-span-1 col-span-2 shadow">
                        Jana Semula
                    </button>
                    <button id="btn-jawapan" onclick="toggleAnswers()" class="bg-sky-500 hover:bg-sky-600 text-white py-2 px-3 rounded-lg font-bold flex items-center justify-center gap-2 shadow">
                        <span id="text-jawapan">Jawapan</span>
                    </button>
                    <button onclick="window.print()" class="bg-gray-800 hover:bg-gray-900 text-white py-2 px-3 rounded-lg font-bold flex items-center justify-center gap-2 shadow">
                        Cetak Tepat
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- BEKAS LEMBARAN -->
    <div id="worksheet-wrapper" class="max-w-4xl mx-auto space-y-8">
        <!-- Dijana oleh JS -->
    </div>

    <script>
        // Data Kosa Kata Dinamik
        const names = ["Ali", "Abu", "Aminah", "Fatimah", "Sarah", "Mei Ling", "Ravi", "Siti", "Amira", "Sani", "Daniel", "Aina", "Muthu", "Chong", "Suzi"];
        const fruits = ["epal", "mangga", "rambutan", "anggur", "oren", "manggis", "betik"];
        const items = ["guli", "buku cerita", "basikal", "pelekat", "kerang", "kotak", "pemadam", "setem", "pensel warna", "pembaris", "mainan", "gula-gula"];
        const containers = ["bakul", "kotak", "balang", "beg", "bekas", "plastik"];
        const vehicles = ["kereta", "bas", "van", "motosikal"];

        // VARIABLES GLOBAL UTAMA (QA FIX)
        let showAnswersMode = false;
        let currentQuestionsData = []; // Menyimpan soalan semasa supaya tak berubah bila papar jawapan

        const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const getRandomItem = (arr) => arr[Math.floor(Math.random() * arr.length)];

        // Enjin Pembuat Corak Ayat
        const createWordProblem = (operation) => {
            const name1 = getRandomItem(names);
            let name2 = getRandomItem(names);
            while(name1 === name2) name2 = getRandomItem(names); 

            const item = getRandomItem(items);
            const fruit = getRandomItem(fruits);
            const container = getRandomItem(containers);
            const vehicle = getRandomItem(vehicles);
            
            const patternIndex = getRandomInt(1, 10); 
            
            let n1, n2, answer, text, equation;

            if (operation === 'tambah') {
                n1 = getRandomInt(11, 60); 
                n2 = getRandomInt(10, 45); 
                answer = n1 + n2;
                equation = `${n1} + ${n2} = ${answer}`;

                switch(patternIndex) {
                    case 1: text = `${name1} ada ${n1} biji ${item}. ${name2} beri ${name1} ${n2} biji ${item} lagi. Berapakah jumlah ${item} ${name1} sekarang?`; break;
                    case 2: text = `Di dalam ${container} ada ${n1} biji ${fruit} merah dan ${n2} biji ${fruit} hijau. Kira jumlah semua ${fruit} di dalam ${container} itu.`; break;
                    case 3: text = `${name1} membeli ${n1} ${item} pada hari Isnin. Dia membeli ${n2} ${item} lagi pada hari Selasa. Berapakah jumlah ${item} yang dibelinya?`; break;
                    case 4: text = `Sebuah kedai ada ${n1} buah ${vehicle}. Kedai itu menerima ${n2} buah ${vehicle} baharu. Berapakah jumlah ${vehicle} di kedai itu sekarang?`; break;
                    case 5: text = `${name1} ada ${n1} keping ${item}. Kakaknya memberikan ${n2} keping ${item} lagi. Berapakah jumlah ${item} ${name1} semuanya?`; break;
                    case 6: text = `Di atas padang ada ${n1} orang murid lelaki dan ${n2} orang murid perempuan. Berapakah jumlah murid di padang itu?`; break;
                    case 7: text = `${name1} mengumpul ${n1} biji kerang. Adiknya mengumpul ${n2} biji kerang. Berapakah jumlah kerang yang mereka kumpul bersama?`; break;
                    case 8: text = `Sebuah lori membawa ${n1} buah kotak. Sebuah lori lain membawa ${n2} buah kotak. Kira jumlah kotak yang dibawa oleh kedua-dua lori itu.`; break;
                    case 9: text = `Pak Abu memetik ${n1} biji ${fruit} pagi tadi. Petang ini dia memetik ${n2} biji ${fruit} lagi. Berapakah jumlah ${fruit} Pak Abu?`; break;
                    case 10: text = `Kelas 2 Cerdik ada ${n1} orang murid. Kelas 2 Pintar pula ada ${n2} orang murid. Berapakah jumlah murid untuk kedua-dua kelas itu?`; break;
                }
            } 
            else if (operation === 'tolak') {
                n1 = getRandomInt(40, 99); 
                n2 = getRandomInt(10, n1 - 10); 
                answer = n1 - n2;
                equation = `${n1} - ${n2} = ${answer}`;

                switch(patternIndex) {
                    case 1: text = `Ibu membeli ${n1} biji telur. ${n2} biji telur telah pecah. Berapakah telur yang masih elok?`; break;
                    case 2: text = `${name1} ada ${n1} batang pensel. Dia memberikan ${n2} batang pensel kepada kawannya. Berapakah baki pensel ${name1}?`; break;
                    case 3: text = `Di dalam sebuah kotak ada ${n1} buah buku. Cikgu mengeluarkan ${n2} buah buku. Berapakah buku yang tinggal di dalam kotak?`; break;
                    case 4: text = `Sebuah kedai roti membakar ${n1} biji bun. ${n2} biji bun telah dijual. Berapakah bun yang belum dijual?`; break;
                    case 5: text = `${name1} ada ${n1} keping pemadam. Dia hilang ${n2} keping pemadam itu. Berapakah pemadam ${name1} yang tinggal?`; break;
                    case 6: text = `Pak Cik memetik ${n1} biji ${fruit}. Dia menjual ${n2} biji daripadanya. Berapakah baki ${fruit} Pak Cik?`; break;
                    case 7: text = `Di dalam sebuah kolam ada ${n1} ekor ikan. ${n2} ekor ikan telah mati. Berapakah ekor ikan yang masih hidup?`; break;
                    case 8: text = `Sebuah bas membawa ${n1} orang penumpang. Apabila sampai di stesen, ${n2} orang penumpang turun. Berapakah penumpang yang tinggal di dalam bas?`; break;
                    case 9: text = `${name1} ada ${n1} keping setem. Dia memberi adiknya ${n2} keping. Berapakah setem ${name1} sekarang?`; break;
                    case 10: text = `Sebuah pokok ada ${n1} biji ${fruit}. Malangnya, ${n2} biji telah dimakan burung. Berapakah ${fruit} yang masih elok di pokok?`; break;
                }
            }
            else if (operation === 'darab') {
                n1 = getRandomInt(3, 9); 
                n2 = getRandomInt(3, 12); 
                answer = n1 * n2;
                equation = `${n1} × ${n2} = ${answer}`;

                switch(patternIndex) {
                    case 1: text = `Ada ${n1} buah ${container}. Setiap ${container} mengandungi ${n2} biji bola. Berapakah jumlah semua bola itu?`; break;
                    case 2: text = `Setiap murid menerima ${n2} batang pensel warna. Jika ada ${n1} orang murid, berapakah jumlah pensel warna semuanya?`; break;
                    case 3: text = `Ibu membeli ${n1} gugus anggur. Setiap gugus ada ${n2} biji anggur. Berapakah jumlah buah anggur yang ibu beli?`; break;
                    case 4: text = `Di dalam sebuah kelas ada ${n1} baris meja. Setiap baris ada ${n2} buah meja. Berapakah jumlah meja di dalam kelas itu?`; break;
                    case 5: text = `Sebuah basikal ada 2 biji roda. Berapakah jumlah roda bagi ${n1} buah basikal yang sama?`; equation = `${n1} × 2 = ${n1 * 2}`; answer = n1 * 2; break;
                    case 6: text = `Setiap tingkat bangunan ada ${n2} buah bilik. Berapakah jumlah bilik jika bangunan itu ada ${n1} tingkat?`; break;
                    case 7: text = `Kakak menyusun kuih ke dalam ${n1} buah piring. Setiap piring diletakkan ${n2} biji kuih. Berapakah jumlah kuih semuanya?`; break;
                    case 8: text = `Sebuah ${vehicle} boleh dinaiki oleh ${n2} orang. Berapakah jumlah orang yang boleh menaiki ${n1} buah ${vehicle} yang sama?`; break;
                    case 9: text = `Bapa membeli ${n1} kotak susu. Setiap kotak mengandungi ${n2} botol susu. Berapakah jumlah botol susu yang dibeli bapa?`; break;
                    case 10: text = `Setiap hari ${name1} menyimpan RM${n2}. Berapakah jumlah wang simpanan ${name1} selepas ${n1} hari?`; break;
                }
            }
            else if (operation === 'bahagi') {
                n2 = getRandomInt(2, 9); 
                answer = getRandomInt(3, 12); 
                n1 = n2 * answer;
                equation = `${n1} ÷ ${n2} = ${answer}`;

                switch(patternIndex) {
                    case 1: text = `Cikgu ada ${n1} batang pembaris. Dia membahagikan pembaris itu sama rata kepada ${n2} orang murid. Berapakah pembaris yang diterima oleh setiap murid?`; break;
                    case 2: text = `Ibu ada ${n1} keping biskut dan mahu memasukkannya ke dalam ${n2} buah balang secara sama banyak. Berapakah biskut di dalam setiap balang?`; break;
                    case 3: text = `Ada ${n1} biji guli di dalam sebuah bekas. Guli itu dikongsi sama rata antara ${n2} orang kawan. Berapakah guli yang dapat setiap seorang?`; break;
                    case 4: text = `Seorang peladang mahu memasukkan ${n1} biji oren ke dalam ${n2} buah bakul secara sama banyak. Berapakah oren di dalam setiap bakul?`; break;
                    case 5: text = `Pak Cik ada ${n1} ekor anak ayam. Dia membahagikan anak ayam itu ke dalam ${n2} buah reban secara sama rata. Berapakah anak ayam di dalam setiap reban?`; break;
                    case 6: text = `Ada ${n1} buah buku yang perlu disusun secara sama banyak di atas ${n2} tingkat rak. Berapakah buah buku pada setiap tingkat rak?`; break;
                    case 7: text = `Sebuah kilang mahu mengagihkan ${n1} buah kerusi kepada ${n2} buah sekolah secara sama rata. Berapakah kerusi yang diterima oleh setiap sekolah?`; break;
                    case 8: text = `${name1} ada ${n1} keping pelekat. Dia menampal pelekat itu sama banyak pada ${n2} buah muka surat buku log. Berapakah pelekat pada setiap muka surat?`; break;
                    case 9: text = `Atuk ada ${n1} biji rambutan. Atuk memberikan rambutan itu sama banyak kepada ${n2} orang cucunya. Berapakah biji rambutan yang didapat oleh setiap cucu?`; break;
                    case 10: text = `Kakak memotong sebiji kek kepada ${n1} potong. Kek itu dibahagikan sama rata kepada ${n2} orang tetangga. Berapakah potong kek yang diterima oleh setiap tetangga?`; break;
                }
            }
            return { text, equation, answer };
        };

        // FUNGSI 1: JANA DATA SAHAJA
        function generateNewQuestions() {
            const ops = [];
            if(document.getElementById('op-tambah').checked) ops.push('tambah');
            if(document.getElementById('op-tolak').checked) ops.push('tolak');
            if(document.getElementById('op-darab').checked) ops.push('darab');
            if(document.getElementById('op-bahagi').checked) ops.push('bahagi');

            if (ops.length === 0) {
                alert("Sila pilih sekurang-kurangnya SATU operasi.");
                document.getElementById('op-tambah').checked = true;
                ops.push('tambah');
            }

            const totalQuestions = parseInt(document.getElementById('num-questions').value);
            
            // Kosongkan array lama
            currentQuestionsData = [];

            // Hasilkan dan simpan soalan baru dalam memori
            for (let i = 0; i < totalQuestions; i++) {
                const op = getRandomItem(ops);
                currentQuestionsData.push(createWordProblem(op));
            }

            // Selepas data dijana, barulah panggil fungsi render lukis ke skrin
            renderWorksheet();
        }

        // FUNGSI 2: LUKIS HTML KE SKRIN BERDASARKAN DATA (Tiada soalan baru dijana di sini)
        function renderWorksheet() {
            const qsPerPage = 6; 
            const totalPages = Math.ceil(currentQuestionsData.length / qsPerPage);
            
            const wrapper = document.getElementById('worksheet-wrapper');
            wrapper.innerHTML = ''; 

            let questionCounter = 1;

            for (let p = 0; p < totalPages; p++) {
                
                let pageHTML = `
                <div class="a4-page bg-white p-4 sm:p-8 shadow-xl rounded-2xl print:shadow-none print:rounded-none">
                    <!-- HEADER -->
                    <div class="print-header flex-none border-b-2 border-gray-800 pb-2 mb-4">
                        <h1 class="text-xl font-extrabold text-center mb-2 uppercase tracking-wider text-gray-900">Lembaran Kerja Matematik</h1>
                        <div class="flex flex-col sm:flex-row justify-between gap-1 text-[0.8rem] font-bold text-gray-700">
                            <div class="flex items-end gap-1 w-full sm:w-1/2">
                                <span>NAMA:</span><div class="border-b border-gray-500 flex-grow border-dashed"></div>
                            </div>
                            <div class="flex flex-row justify-between w-full sm:w-1/2 gap-1">
                                <div class="flex items-end gap-1 w-1/2">
                                    <span>KELAS:</span><div class="border-b border-gray-500 flex-grow border-dashed"></div>
                                </div>
                                <div class="flex items-end gap-1 w-1/2">
                                    <span>TARIKH:</span><div class="border-b border-gray-500 flex-grow border-dashed"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- GRID SOALAN -->
                    <div class="question-grid question-grid-screen">
                `;

                // Loop membaca memori data (bukan menjana)
                for (let i = 0; i < qsPerPage; i++) {
                    if (questionCounter > currentQuestionsData.length) break;

                    const q = currentQuestionsData[questionCounter - 1];

                    pageHTML += `
                        <div class="q-box h-full flex flex-col border border-gray-400 p-3 rounded-xl">
                            <!-- Teks Soalan -->
                            <div class="flex gap-2 mb-1 items-start">
                                <span class="bg-gray-800 text-white font-bold text-[0.8rem] h-5 w-5 flex items-center justify-center rounded-full flex-shrink-0 mt-0.5">
                                    ${questionCounter}
                                </span>
                                <p class="q-text text-[0.9rem] leading-snug font-semibold text-gray-800">${q.text}</p>
                            </div>
                            
                            <!-- Ruang Jalan Kerja -->
                            <div class="q-workspace flex-grow border border-dashed rounded-lg p-2 mb-1 flex items-center justify-center bg-gray-50/50 ${showAnswersMode ? 'border-emerald-400 bg-emerald-50' : 'border-gray-300'}">
                                ${showAnswersMode 
                                    ? `<div class="text-lg font-bold text-emerald-600">${q.equation}</div>`
                                    : ``
                                }
                            </div>
                            
                            <!-- Ruang Jawapan -->
                            <div class="q-answer-container flex items-center gap-2 text-sm mt-auto px-1">
                                <span class="font-bold text-gray-700">Jawapan:</span>
                                ${showAnswersMode 
                                    ? `<span class="font-black text-rose-600">${q.answer}</span>`
                                    : `<div class="border-b border-gray-800 flex-grow border-solid"></div>`
                                }
                            </div>
                        </div>
                    `;
                    questionCounter++;
                }

                pageHTML += `
                    </div>
                </div>`; 

                wrapper.innerHTML += pageHTML;
            }
        }

        // FUNGSI 3: TOGGLE BUTANG JAWAPAN SAHAJA (Tak ganggu fungsi menjana)
        function toggleAnswers() {
            showAnswersMode = !showAnswersMode;
            const btn = document.getElementById('btn-jawapan');
            const text = document.getElementById('text-jawapan');

            if (showAnswersMode) {
                text.innerText = "Tutup Jawapan";
                btn.classList.replace('bg-sky-500', 'bg-rose-500');
                btn.classList.replace('hover:bg-sky-600', 'hover:bg-rose-600');
            } else {
                text.innerText = "Paparan Jawapan";
                btn.classList.replace('bg-rose-500', 'bg-sky-500');
                btn.classList.replace('hover:bg-rose-600', 'hover:bg-sky-600');
            }
            
            // Panggil fungsi lukis SAHAJA (soalan kekal)
            renderWorksheet();
        }

        // Pada awal pembukaan web, jana soalan pertama kali
        window.onload = generateNewQuestions;
    </script>
</body>
</html>
