<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjana Lembaran Kerja (QA Approved)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }

        /* --- KAWALAN KETAT UNTUK PERCETAKAN (QA AUDIT) --- */
        @media print {
            @page {
                size: A4 portrait;
                margin: 10mm !important; /* Paksa margin cetakan kecil */
            }
            body {
                background-color: white !important;
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
            }
            .no-print {
                display: none !important;
            }
            /* Kontena utama dikunci pada saiz A4 untuk elak lari ke page 2 */
            .a4-page {
                height: 277mm !important; /* Tinggi A4 (297mm) tolak margin atas bawah (20mm) */
                max-height: 277mm !important;
                width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
                box-shadow: none !important;
                border: none !important;
                page-break-after: always;
                page-break-inside: avoid;
                display: flex;
                flex-direction: column;
            }
            /* Hilangkan page break pada page terakhir supaya tiada blank page */
            .a4-page:last-of-type {
                page-break-after: auto;
            }
            .print-gap {
                gap: 0.75rem !important; /* Rapatkan gap sikit masa print */
            }
        }
    </style>
</head>
<body class="text-gray-800 p-4 md:p-8">

    <!-- PANEL KAWALAN (Tidak dicetak) -->
    <div class="no-print max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow-md mb-8 border-t-4 border-indigo-500">
        <h1 class="text-2xl font-bold text-indigo-700 mb-6 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M9 12l2 2 4-4"></path></svg>
            Penjana Lembaran Kerja (Disemak - 1 Muka Surat Penuh)
        </h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-indigo-50 p-5 rounded-xl border border-indigo-100">
                <h2 class="font-semibold mb-3 text-indigo-800">1. Pilih Operasi:</h2>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center gap-2 p-3 rounded-lg border bg-white cursor-pointer hover:bg-gray-50 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="checkbox" id="op-tambah" class="w-4 h-4" checked onchange="generateWorksheet()">
                        <span class="font-medium">Tambah</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 rounded-lg border bg-white cursor-pointer hover:bg-gray-50 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="checkbox" id="op-tolak" class="w-4 h-4" checked onchange="generateWorksheet()">
                        <span class="font-medium">Tolak</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 rounded-lg border bg-white cursor-pointer hover:bg-gray-50 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="checkbox" id="op-darab" class="w-4 h-4" checked onchange="generateWorksheet()">
                        <span class="font-medium">Darab</span>
                    </label>
                    <label class="flex items-center gap-2 p-3 rounded-lg border bg-white cursor-pointer hover:bg-gray-50 has-[:checked]:bg-indigo-600 has-[:checked]:text-white">
                        <input type="checkbox" id="op-bahagi" class="w-4 h-4" checked onchange="generateWorksheet()">
                        <span class="font-medium">Bahagi</span>
                    </label>
                </div>
            </div>

            <div class="bg-indigo-50 p-5 rounded-xl border border-indigo-100 flex flex-col justify-center gap-4">
                <div class="flex items-center gap-3">
                    <h2 class="font-semibold text-indigo-800 whitespace-nowrap">2. Susunan Cetakan:</h2>
                    <select id="num-questions" class="border-gray-300 rounded-lg p-2 font-medium bg-white w-full" onchange="generateWorksheet()">
                        <option value="4">4 Soalan (Setengah Muka Surat)</option>
                        <option value="8" selected>8 Soalan (Kemas 1 Muka Surat)</option>
                        <option value="16">16 Soalan (Kemas 2 Muka Surat)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 lg:grid-cols-3 gap-2 mt-2">
                    <button onclick="generateWorksheet()" class="bg-emerald-500 hover:bg-emerald-600 text-white py-2 px-3 rounded-lg font-bold flex items-center justify-center gap-2 lg:col-span-1 col-span-2">
                        Jana Semula
                    </button>
                    <button id="btn-jawapan" onclick="toggleAnswers()" class="bg-sky-500 hover:bg-sky-600 text-white py-2 px-3 rounded-lg font-bold flex items-center justify-center gap-2">
                        <span id="text-jawapan">Papar Jawapan</span>
                    </button>
                    <button onclick="window.print()" class="bg-gray-800 hover:bg-gray-900 text-white py-2 px-3 rounded-lg font-bold flex items-center justify-center gap-2">
                        Cetak Tepat
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- BEKAS LEMBARAN (Akan diisi oleh JavaScript) -->
    <div id="worksheet-wrapper" class="max-w-4xl mx-auto space-y-8">
        <!-- Halaman-halaman akan dijana di sini -->
    </div>

    <script>
        const names = ["Ahmad", "Siti", "Ali", "Aisyah", "Muthu", "Mei Ling", "Raju", "Farid", "Nurul", "Daniel"];
        const items = ["biji epal", "batang pensel", "biji guli", "buku cerita", "keping biskut", "gula-gula", "biji oren", "pemadam"];
        const containers = ["bakul", "kotak", "balang", "beg"];

        let showAnswersMode = false;

        const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const getRandomItem = (arr) => arr[Math.floor(Math.random() * arr.length)];

        // Logik soalan dikekalkan seperti sebelumnya
        const generateWordProblem = (operation) => {
            const name = getRandomItem(names);
            const item = getRandomItem(items);
            const container = getRandomItem(containers);
            
            let n1, n2, answer, text, equation;

            switch (operation) {
                case 'tambah':
                    n1 = getRandomInt(15, 80); n2 = getRandomInt(10, 40); answer = n1 + n2;
                    equation = `${n1} + ${n2} = ${answer}`;
                    text = getRandomItem([
                        `${name} ada ${n1} ${item}. Ibunya membelikan ${n2} ${item} lagi kepadanya. Berapakah jumlah ${item} sekarang?`,
                        `Terdapat ${n1} ${item} dalam ${container} merah dan ${n2} ${item} dalam ${container} biru. Kira jumlahnya.`,
                        `${name} kumpul ${n1} ${item} hari Isnin dan ${n2} ${item} hari Selasa. Berapa banyak dikumpul?`
                    ]);
                    break;
                case 'tolak':
                    n1 = getRandomInt(40, 95); n2 = getRandomInt(10, n1 - 10); answer = n1 - n2;
                    equation = `${n1} - ${n2} = ${answer}`;
                    text = getRandomItem([
                        `${name} ada ${n1} ${item}. Dia beri ${n2} ${item} kepada kawannya. Berapakah baki yang tinggal?`,
                        `Kedai ada ${n1} ${item}. Telah dijual ${n2} ${item}. Berapa banyak yang belum dijual?`,
                        `${name} bawa ${n1} ${item} ke sekolah. Dia hilangkan ${n2} ${item}. Berapa baki ${item} sekarang?`
                    ]);
                    break;
                case 'darab':
                    n1 = getRandomInt(2, 9); n2 = getRandomInt(2, 9); answer = n1 * n2;
                    equation = `${n1} × ${n2} = ${answer}`;
                    text = getRandomItem([
                        `${name} beli ${n1} ${container}. Setiap ${container} ada ${n2} ${item}. Berapakah jumlah semuanya?`,
                        `Dalam bilik ada ${n1} meja. Atas setiap meja diletakkan ${n2} ${item}. Kira jumlahnya.`,
                        `Guru susun kerusi dalam ${n1} baris. Setiap baris ada ${n2} kerusi. Berapa jumlah kerusi?`
                    ]);
                    break;
                case 'bahagi':
                    n2 = getRandomInt(2, 9); answer = getRandomInt(3, 9); n1 = n2 * answer;
                    equation = `${n1} ÷ ${n2} = ${answer}`;
                    text = getRandomItem([
                        `${name} ada ${n1} ${item}. Dia agihkan sama rata kepada ${n2} kawan. Berapa setiap kawan dapat?`,
                        `Sebanyak ${n1} ${item} diisi sama rata ke dalam ${n2} ${container}. Berapa bilangan setiap ${container}?`,
                        `Cikgu edarkan ${n1} ${item} kepada ${n2} kumpulan murid. Berapakah diterima setiap kumpulan?`
                    ]);
                    break;
            }
            return { text, equation, answer };
        };

        function generateWorksheet() {
            const ops = [];
            if(document.getElementById('op-tambah').checked) ops.push('tambah');
            if(document.getElementById('op-tolak').checked) ops.push('tolak');
            if(document.getElementById('op-darab').checked) ops.push('darab');
            if(document.getElementById('op-bahagi').checked) ops.push('bahagi');

            if (ops.length === 0) {
                alert("Pilih sekurang-kurangnya SATU operasi.");
                document.getElementById('op-tambah').checked = true;
                ops.push('tambah');
            }

            const totalQuestions = parseInt(document.getElementById('num-questions').value);
            const qsPerPage = 8; // Tetapan ketat: Maksimum 8 soalan per muka surat (Grid 4x2)
            const totalPages = Math.ceil(totalQuestions / qsPerPage);
            
            const wrapper = document.getElementById('worksheet-wrapper');
            wrapper.innerHTML = ''; 

            let questionCounter = 1;

            // Loop mengikut bilangan muka surat (Page Chunking)
            for (let p = 0; p < totalPages; p++) {
                
                let numRows = 4; // Default untuk 8 soalan
                let questionsInThisPage = qsPerPage;
                
                // Jika user pilih 4 soalan sahaja
                if (totalQuestions === 4) {
                    numRows = 2;
                    questionsInThisPage = 4;
                }
                
                // HTML Pengepala untuk setiap muka surat
                let pageHTML = `
                <div class="a4-page bg-white p-6 sm:p-10 shadow-xl rounded-2xl">
                    <!-- HEADER KEKAL KECIL UNTUK JIMAT RUANG -->
                    <div class="flex-none border-b-2 border-gray-800 pb-3 mb-4">
                        <h1 class="text-xl sm:text-2xl font-black text-center mb-3 uppercase tracking-widest text-gray-900">Lembaran Kerja Matematik</h1>
                        <div class="flex flex-col sm:flex-row justify-between gap-3 text-sm font-semibold">
                            <div class="flex items-end gap-2 w-full sm:w-1/2">
                                <span>NAMA :</span><div class="border-b border-gray-600 flex-grow border-dashed"></div>
                            </div>
                            <div class="flex flex-row justify-between w-full sm:w-1/2 gap-3">
                                <div class="flex items-end gap-2 w-1/2">
                                    <span>KELAS :</span><div class="border-b border-gray-600 flex-grow border-dashed"></div>
                                </div>
                                <div class="flex items-end gap-2 w-1/2">
                                    <span>TARIKH :</span><div class="border-b border-gray-600 flex-grow border-dashed"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- GRID SOALAN DIKUNCI FLEKSIBILITI (flex-grow) -->
                    <div class="flex-grow grid grid-cols-2 gap-4 print-gap" style="grid-template-rows: repeat(${numRows}, minmax(0, 1fr));">
                `;

                // Loop soalan dalam muka surat tersebut
                for (let i = 0; i < questionsInThisPage; i++) {
                    if (questionCounter > totalQuestions) break;

                    const op = getRandomItem(ops);
                    const q = generateWordProblem(op);

                    // Kotak soalan dipaksa memanjang (h-full, flex-col)
                    pageHTML += `
                        <div class="h-full flex flex-col border border-gray-300 p-3 rounded-xl">
                            <!-- Teks Soalan -->
                            <div class="flex gap-2 mb-2">
                                <span class="bg-gray-800 text-white font-bold text-sm h-6 w-6 flex items-center justify-center rounded-full flex-shrink-0 mt-0.5">
                                    ${questionCounter}
                                </span>
                                <p class="text-[0.9rem] leading-tight font-medium text-gray-800">${q.text}</p>
                            </div>
                            
                            <!-- Ruang Jalan Kerja dipaksa penuhi baki ruang (flex-grow) -->
                            <div class="flex-grow border border-dashed rounded-lg p-2 mb-2 flex items-center justify-center bg-gray-50 ${showAnswersMode ? 'border-emerald-400 bg-emerald-50' : 'border-gray-300'}">
                                ${showAnswersMode 
                                    ? `<div class="text-xl font-bold text-emerald-600">${q.equation}</div>`
                                    : ``
                                }
                            </div>
                            
                            <!-- Ruang Jawapan -->
                            <div class="flex items-center gap-2 text-sm mt-auto">
                                <span class="font-bold text-gray-700">Jawapan:</span>
                                ${showAnswersMode 
                                    ? `<span class="font-bold text-rose-600 underline">${q.answer}</span>`
                                    : `<div class="border-b border-gray-800 flex-grow max-w-[80px]"></div>`
                                }
                            </div>
                        </div>
                    `;
                    questionCounter++;
                }

                pageHTML += `
                    </div>
                    <!-- FOOTER -->
                    <div class="flex-none print-only mt-2 text-center text-[10px] text-gray-500 font-medium border-t pt-1">
                        Penyelesaian Masalah | Muka Surat ${p + 1}
                    </div>
                </div>`; // Tutup a4-page

                wrapper.innerHTML += pageHTML;
            }
        }

        function toggleAnswers() {
            showAnswersMode = !showAnswersMode;
            const btn = document.getElementById('btn-jawapan');
            const text = document.getElementById('text-jawapan');

            if (showAnswersMode) {
                text.innerText = "Tutup Jawapan";
                btn.classList.replace('bg-sky-500', 'bg-rose-500');
                btn.classList.replace('hover:bg-sky-600', 'hover:bg-rose-600');
            } else {
                text.innerText = "Papar Jawapan";
                btn.classList.replace('bg-rose-500', 'bg-sky-500');
                btn.classList.replace('hover:bg-rose-600', 'hover:bg-sky-600');
            }
            generateWorksheet();
        }

        window.onload = generateWorksheet;
    </script>
</body>
</html>
